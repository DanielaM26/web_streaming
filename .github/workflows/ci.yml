name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  web-checks:
    name: Web checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify web entry files exist
        run: |
          test -f index.html
          test -f app.js

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check HTML and JS wiring
        run: node scripts/check-web-smoke.mjs

  java-client-build:
    name: Java client build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven project
        working-directory: java-client
        run: mvn -B -DskipTests package

  docker-checks:
    name: Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build web image
        run: docker build -f Dockerfile.web -t web-streaming-web .

      - name: Smoke test web image
        run: |
          docker run -d --name web-streaming-web-smoke -p 8080:80 web-streaming-web
          trap "docker rm -f web-streaming-web-smoke" EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080

      - name: Build Java viewer image
        run: docker build -f java-client/Dockerfile -t web-streaming-java-viewer ./java-client
