services:
  janus:
    image: swmansion/janus-gateway:0.11.8-0
    environment:
      WEBSOCKETS_ENABLED: "true"
      GATEWAY_IP: ${JANUS_GATEWAY_IP:-127.0.0.1}
      STUN_SERVER: ${JANUS_STUN_SERVER:-stun.l.google.com}
      STUN_PORT: ${JANUS_STUN_PORT:-19302}
      RTP_PORT_RANGE: ${JANUS_RTP_PORT_RANGE:-10000-10099}
    ports:
      - "${JANUS_WS_PORT:-8188}:8188"
      - "10000-10099:10000-10099/udp"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - janus
    ports:
      - "8080:80"

  java-viewer:
    build:
      context: ./java-client
      dockerfile: Dockerfile
    depends_on:
      - janus
    environment:
      JANUS_WS: ${JANUS_WS:-ws://janus:8188}
      JANUS_ROOM: ${JANUS_ROOM:-1234}
      JANUS_DISPLAY: ${JANUS_DISPLAY:-java-viewer}
      JANUS_FEED_ID: ${JANUS_FEED_ID:-1}
    profiles:
      - viewer

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_METRICS_ENABLED: "true"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles:
      - monitoring

  loki:
    image: grafana/loki:2.9.8
    command:
      - "-config.file=/etc/loki/local-config.yml"
    ports:
      - "${LOKI_PORT:-13100}:3100"
    volumes:
      - ./monitoring/loki/local-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    profiles:
      - logging

  promtail:
    image: grafana/promtail:2.9.8
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      - loki
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles:
      - logging

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
